<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <title>订单关联 - 佩蒂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #09348B 0%, #1a5eb8 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            opacity: 0.1;
            background: white;
        }

        .bg-decoration-1 {
            top: -200px;
            right: -100px;
        }

        .bg-decoration-2 {
            bottom: -200px;
            left: -100px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 0;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* 底部图片 */
        .bottom-image {
            width: 100%;
            height: 100px;
            background-image: url('img/p2.png');
            background-size: cover;
            background-position: center;
            position: relative;
            margin-top: 20px;
        }

        .bottom-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(white, transparent);
        }

        /* 顶部图片 */
        .hero-image {
            width: 100%;
            height: 130px;
            background-image: url('img/p1.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(transparent, white);
        }

        .content-area {
            padding: 0 24px;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 16px;
            }

            .hero-image {
                height: 110px;
            }

            .content-area {
                padding: 0 18px;
            }

            .logo-container {
                width: 64px;
                height: 64px;
                border-radius: 14px;
            }

            .brand-name {
                font-size: 22px;
            }

            .brand-slogan {
                font-size: 13px;
            }

            h1 {
                font-size: 18px;
                margin-bottom: 14px;
            }

            .benefits {
                padding: 12px;
                gap: 8px;
            }

            .benefit-icon {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }

            .benefit-title {
                font-size: 12px;
            }

            input[type="text"] {
                padding: 13px 16px;
                font-size: 16px;
                /* 防止iOS缩放 */
            }

            .input-hint {
                font-size: 11px;
                margin-top: 6px;
            }

            button {
                padding: 14px;
                font-size: 16px;
            }

            .security-info {
                margin-top: 16px;
                padding-top: 12px;
            }

            .footer {
                margin-top: 0;
                padding: 10px 18px;
                font-size: 11px;
            }

            .bottom-image {
                height: 85px;
            }
        }

        /* 品牌头部 */
        .brand-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .logo-container {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #09348B 0%, #1a5eb8 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 8px 20px rgba(9, 52, 139, 0.4);
        }

        .logo-placeholder {
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .brand-slogan {
            color: #999;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 600;
        }

        /* 好处说明 */
        .benefits {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .benefit-icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #09348B 0%, #1a5eb8 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .benefit-text {
            flex: 1;
            min-width: 0;
        }

        .benefit-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .benefit-desc {
            display: none;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-size: 15px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            background-color: #fafafa;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="text"]:focus {
            border-color: #09348B;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(9, 52, 139, 0.1);
        }

        input[type="text"]::placeholder {
            color: #ccc;
        }

        .input-hint {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #09348B 0%, #1a5eb8 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(9, 52, 139, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(9, 52, 139, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-size: 15px;
        }

        .message.success {
            background-color: #f0f9eb;
            color: #52c41a;
            display: block;
            border: 1px solid #b7eb8f;
        }

        .message.error {
            background-color: #fff2f0;
            color: #ff4d4f;
            display: block;
            border: 1px solid #ffccc7;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 安全提示 */
        .security-info {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #f0f0f0;
            text-align: center;
        }

        .security-info p {
            color: #999;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .security-icon {
            width: 18px;
            height: 18px;
            background: #52c41a;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .security-icon svg {
            width: 12px;
            height: 12px;
        }

        /* 页脚 */
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #bbb;
            font-size: 12px;
        }
    </style>
</head>

    <!-- 仅需要基础功能，不需要额外的 SDK -->
    <script>
        // ===================== 配置区域（请修改这些配置）=====================

        // 后端接口地址 - 表单提交接口
        const API_URL = 'https://api.peidigroup.cn/ai/qywx/from';

        // 企业微信 CorpID
        const CORP_ID = 'ww3e4d6806d3572c2e';

        // ===================================================================

        // 保存从 URL 获取的 code
        let authCode = '';

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function () {
            initQywx();
        });

        // 初始化企业微信
        function initQywx() {
            // 显示调试信息
            const debugDiv = document.getElementById('debugInfo');
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            debugDiv.innerHTML = `
                <div><strong>当前URL:</strong> ${window.location.href}</div>
                <div><strong>URL参数:</strong> ${JSON.stringify(Object.fromEntries(urlParams))}</div>
                <div><strong>code:</strong> ${code || '暂无'}</div>
            `;

            if (code) {
                // 如果有 code，保存起来，等待用户提交订单
                console.log('✅ URL中找到code:', code);
                authCode = code;
                debugDiv.innerHTML += `
                    <div style="color: #52c41a; margin-top: 8px;"><strong>✅ 已获取code，可提交订单</strong></div>
                `;
            } else {
                // 如果没有 code，跳转到企业微信授权
                console.log('URL中没有code，跳转到授权页面');
                redirectToAuth();
            }
        }

        // 跳转到企业微信授权页面
        function redirectToAuth() {
            // 当前页面地址，授权后会跳转回来
            const redirectUri = encodeURIComponent(window.location.href);

            // 企业微信授权地址
            const authUrl = `https://open.weixin.qq.com/connect/oauth2/authorize?appid=${CORP_ID}&redirect_uri=${redirectUri}&response_type=code&scope=snsapi_base&state=STATE#wechat_redirect`;

            console.log('跳转到授权页面:', authUrl);
            window.location.href = authUrl;
        }

        // 提交订单关联
        function submitOrder() {
            const orderNo = document.getElementById('orderNo').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            const debugDiv = document.getElementById('debugInfo');

            // 验证订单编号
            if (!orderNo) {
                showMessage('请输入订单编号', 'error');
                return;
            }

            // 验证 code
            if (!authCode) {
                showMessage('正在获取用户信息，请稍等...', 'error');
                return;
            }

            // 禁用按钮，显示加载状态
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>提交中...';
            messageDiv.style.display = 'none';

            // 准备请求数据 - 固定 userId 为 peidi2，传 code 和 otid
            const requestData = {
                userId: 'peidi2',
                code: authCode,
                otid: orderNo
            };

            console.log('提交数据:', requestData);
            debugDiv.innerHTML += `
                <div style="margin-top: 8px;"><strong>⏳ 正在提交订单...</strong></div>
                <div style="margin-top: 4px;">userId: peidi2</div>
                <div style="margin-top: 4px;">otid: ${orderNo}</div>
            `;

            // 调用后端接口
            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络请求失败');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('接口返回:', data);
                    debugDiv.innerHTML += `
                        <div style="margin-top: 8px;"><strong>📦 后端返回:</strong></div>
                        <div style="margin-top: 4px;">${JSON.stringify(data)}</div>
                    `;
                    if (data.success || data.code === 200) {
                        showMessage('订单关联成功！', 'success');
                        debugDiv.innerHTML += `
                            <div style="color: #52c41a; margin-top: 8px;"><strong>✅ 订单关联成功!</strong></div>
                        `;
                        setTimeout(() => {
                            if (typeof wx !== 'undefined' && wx.miniProgram) {
                                wx.miniProgram.navigateBack();
                            }
                        }, 1500);
                    } else {
                        const errorMsg = data.message || '订单关联失败，请重试';
                        showMessage(errorMsg, 'error');
                        debugDiv.innerHTML += `
                            <div style="color: #ff4d4f; margin-top: 8px;"><strong>❌ 关联失败:</strong> ${errorMsg}</div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('请求错误:', error);
                    showMessage('网络错误，请稍后重试', 'error');
                    debugDiv.innerHTML += `
                        <div style="color: #ff4d4f; margin-top: 8px;"><strong>❌ 请求失败:</strong> ${error.message}</div>
                    `;
                })
                .finally(() => {
                    // 恢复按钮状态
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '确定关联';
                });
        }

        // 显示消息
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }
    </script>
