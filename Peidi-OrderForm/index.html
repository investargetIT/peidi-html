<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <title>订单关联 - 佩蒂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #09348B 0%, #1a5eb8 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            opacity: 0.1;
            background: white;
        }

        .bg-decoration-1 {
            top: -200px;
            right: -100px;
        }

        .bg-decoration-2 {
            bottom: -200px;
            left: -100px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 0;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* 底部图片 */
        .bottom-image {
            width: 100%;
            height: 100px;
            background-image: url('img/p2.png');
            background-size: cover;
            background-position: center;
            position: relative;
            margin-top: 20px;
        }

        .bottom-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(white, transparent);
        }

        /* 顶部图片 */
        .hero-image {
            width: 100%;
            height: 130px;
            background-image: url('img/p1.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(transparent, white);
        }

        .content-area {
            padding: 0 24px;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 16px;
            }

            .hero-image {
                height: 110px;
            }

            .content-area {
                padding: 0 18px;
            }

            .logo-container {
                width: 64px;
                height: 64px;
                border-radius: 14px;
            }

            .brand-name {
                font-size: 22px;
            }

            .brand-slogan {
                font-size: 13px;
            }

            h1 {
                font-size: 18px;
                margin-bottom: 14px;
            }

            .benefits {
                padding: 12px;
                gap: 8px;
            }

            .benefit-icon {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }

            .benefit-title {
                font-size: 12px;
            }

            input[type="text"] {
                padding: 13px 16px;
                font-size: 16px;
                /* 防止iOS缩放 */
            }

            .input-hint {
                font-size: 11px;
                margin-top: 6px;
            }

            button {
                padding: 14px;
                font-size: 16px;
            }

            .security-info {
                margin-top: 16px;
                padding-top: 12px;
            }

            .footer {
                margin-top: 0;
                padding: 10px 18px;
                font-size: 11px;
            }

            .bottom-image {
                height: 85px;
            }
        }

        /* 品牌头部 */
        .brand-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .logo-container {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #09348B 0%, #1a5eb8 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 8px 20px rgba(9, 52, 139, 0.4);
        }

        .logo-placeholder {
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .brand-slogan {
            color: #999;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 600;
        }

        /* 好处说明 */
        .benefits {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .benefit-icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #09348B 0%, #1a5eb8 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .benefit-text {
            flex: 1;
            min-width: 0;
        }

        .benefit-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .benefit-desc {
            display: none;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-size: 15px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            background-color: #fafafa;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="text"]:focus {
            border-color: #09348B;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(9, 52, 139, 0.1);
        }

        input[type="text"]::placeholder {
            color: #ccc;
        }

        .input-hint {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #09348B 0%, #1a5eb8 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(9, 52, 139, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(9, 52, 139, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-size: 15px;
        }

        .message.success {
            background-color: #f0f9eb;
            color: #52c41a;
            display: block;
            border: 1px solid #b7eb8f;
        }

        .message.error {
            background-color: #fff2f0;
            color: #ff4d4f;
            display: block;
            border: 1px solid #ffccc7;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 安全提示 */
        .security-info {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #f0f0f0;
            text-align: center;
        }

        .security-info p {
            color: #999;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .security-icon {
            width: 18px;
            height: 18px;
            background: #52c41a;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .security-icon svg {
            width: 12px;
            height: 12px;
        }

        /* 页脚 */
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #bbb;
            font-size: 12px;
        }

        /* 成功/失败状态动画 */
        .status-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .status-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .status-icon-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .status-icon-wrapper.success {
            background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%);
            box-shadow: 0 10px 30px rgba(82,196,26,0.3);
        }

        .status-icon-wrapper.error {
            background: linear-gradient(135deg, #ff4d4f 0%, #ff7875 100%);
            box-shadow: 0 10px 30px rgba(255,77,79,0.3);
        }

        .status-icon {
            width: 50px;
            height: 50px;
        }

        .status-icon-wrapper.success .status-icon path {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawCheck 0.6s ease forwards 0.3s;
        }

        .status-icon-wrapper.error .status-icon path {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawCross 0.6s ease forwards 0.3s;
        }

        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes drawCross {
            to {
                stroke-dashoffset: 0;
            }
        }

        .status-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
        }

        .status-desc {
            font-size: 15px;
            color: #666;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .status-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #09348B 0%, #1a5eb8 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(9,52,139,0.3);
        }

        .status-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(9,52,139,0.4);
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: confettiFall 1.5s ease-out forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(150px) rotate(720deg);
            }
        }

        /* 调试信息区域样式 (已注释，需要时取消注释)
        .debug-info {
            background: #1e1e1e;
            color: #00ff00;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-family: monospace;
            font-size: 11px;
            max-height: 300px;
            overflow-y: auto;
            word-break: break-all;
            display: none;
            line-height: 1.4;
        }

        .debug-info.active {
            display: block;
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }

        .debug-title {
            font-weight: bold;
            color: #fff;
            font-size: 13px;
        }

        .debug-clear-btn {
            background: #ff4d4f;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .debug-log-entry {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        .debug-timestamp {
            color: #888;
            font-size: 10px;
        }

        .debug-message {
            color: #00ff00;
        }

        .debug-data {
            color: #ffa500;
            white-space: pre-wrap;
            margin-top: 4px;
        }
        */
    </style>
</head>

    <!-- 仅需要基础功能，不需要额外的 SDK -->
    <script>
        // 调试日志函数
        function debugLog(message, data) {
            const timestamp = new Date().toLocaleTimeString();

            // 只在调试区域激活时才显示在页面上
            const debugDiv = document.getElementById('debugInfo');
            if (debugDiv && debugDiv.classList.contains('active')) {
                const debugLogs = document.getElementById('debugLogs');
                const logEntry = document.createElement('div');
                logEntry.className = 'debug-log-entry';

                const timeSpan = document.createElement('div');
                timeSpan.className = 'debug-timestamp';
                timeSpan.textContent = `[${timestamp}]`;
                logEntry.appendChild(timeSpan);

                const msgSpan = document.createElement('div');
                msgSpan.className = 'debug-message';
                msgSpan.textContent = message;
                logEntry.appendChild(msgSpan);

                if (data !== undefined && data !== null) {
                    const dataDiv = document.createElement('div');
                    dataDiv.className = 'debug-data';
                    dataDiv.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : String(data);
                    logEntry.appendChild(dataDiv);
                }

                debugLogs.insertBefore(logEntry, debugLogs.firstChild);
            }

            // 同时输出到控制台（以备需要时用）
            try {
                console.log(`[${timestamp}] ${message}`, data || '');
            } catch (e) {
                // 忽略控制台错误
            }
        }

        // 清空调试信息
        function clearDebugInfo() {
            const debugLogs = document.getElementById('debugLogs');
            debugLogs.innerHTML = '';
        }

        // ===================== 配置区域（请修改这些配置）=====================

        // 后端接口地址 - 表单提交接口
        const API_URL = 'https://api.peidigroup.cn/ai/qywx/from';

        // 订单验证接口
        const VERIFY_ORDER_URL = 'https://api.peidigroup.cn/oms/orders/countByOtid';

        // API Token - 从环境变量获取
        const API_TOKEN = '1930161144376926172';

        // 企业微信 CorpID
        const CORP_ID = 'ww3e4d6806d3572c2e';

        // ===================================================================

        // 保存从 URL 获取的 code
        let authCode = '';

        // 切换调试显示
        function toggleDebug() {
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.classList.toggle('active');
            const btn = document.getElementById('toggleDebugBtn');
            btn.textContent = debugDiv.classList.contains('active') ? '关闭' : '调试';
            btn.style.background = debugDiv.classList.contains('active') ? '#52c41a' : '#666';
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function () {
            // 显示基本调试信息（仅输出到控制台）
            try {
                console.log('页面加载完成', {
                    url: window.location.href,
                    userAgent: navigator.userAgent,
                    apiUrl: API_URL,
                    verifyUrl: VERIFY_ORDER_URL,
                    corpId: CORP_ID
                });
            } catch (e) {}
            initQywx();
        });

        // 初始化企业微信
        function initQywx() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                console.log('✅ URL中找到code:', code);
                authCode = code;
            } else {
                console.log('URL中没有code，跳转到授权页面');
                redirectToAuth();
            }
        }

        // 跳转到企业微信授权页面
        function redirectToAuth() {
            const redirectUri = encodeURIComponent(window.location.href);
            const authUrl = `https://open.weixin.qq.com/connect/oauth2/authorize?appid=${CORP_ID}&redirect_uri=${redirectUri}&response_type=code&scope=snsapi_base&state=STATE#wechat_redirect`;
            console.log('跳转到授权页面:', authUrl);
            window.location.href = authUrl;
        }

        // 验证订单是否存在
        function verifyOrder(orderNo) {
            if (!orderNo) {
                debugLog('错误: 订单号不能为空');
                return Promise.reject(new Error('订单号不能为空'));
            }

            const url = new URL(VERIFY_ORDER_URL);
            url.searchParams.append('otid', orderNo);

            debugLog('开始验证订单', { orderNo: orderNo, url: url.toString() });

            return fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': API_TOKEN,
                    'Content-Type': 'application/json'
                }
            })
                .then(response => {
                    debugLog('收到响应', { status: response.status, statusText: response.statusText, ok: response.ok });
                    if (!response.ok) {
                        throw new Error(`验证订单请求失败: HTTP ${response.status} ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    debugLog('订单验证接口返回完整数据', data);

                    // 检查返回数据
                    if (data.success === false && data.code === 100100012) {
                        throw new Error('身份验证失败，请联系客服');
                    }

                    if (data.code === 200 && data.success === true) {
                        // 检查数量是否大于0
                        const count = typeof data.data === 'number' ? data.data : parseInt(data.data);
                        debugLog('订单数量检查', { rawData: data.data, parsedCount: count, isGreaterThanZero: count > 0 });
                        if (count > 0) {
                            return true;
                        }
                    } else {
                        debugLog('响应不符合预期格式', { expectedCode: 200, expectedSuccess: true, actualCode: data.code, actualSuccess: data.success });
                    }

                    // 默认返回false
                    debugLog('订单验证结果: 不存在');
                    return false;
                })
                .catch(error => {
                    debugLog('验证订单出错', { error: error.message, stack: error.stack });
                    throw error;
                });
        }

        // 提交订单关联
        function submitOrder() {
            const orderNo = document.getElementById('orderNo').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');

            debugLog('===== 开始提交订单 =====', { orderNo: orderNo, authCode: authCode ? '已获取' : '未获取' });

            if (!orderNo) {
                showStatusOverlay('error', '订单号不能为空', '请您先输入订单编号，订单号不允许为空哦~');
                debugLog('验证失败: 订单号为空');
                return;
            }

            if (!authCode) {
                showMessage('正在获取您的信息，请稍等片刻~', 'error');
                debugLog('验证失败: 没有authCode');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>正在验证订单...';
            messageDiv.style.display = 'none';

            // 先验证订单
            verifyOrder(orderNo)
                .then(orderExists => {
                    debugLog('订单验证结果', { exists: orderExists });
                    if (!orderExists) {
                        showStatusOverlay('error', '订单未找到', '订单号不存在或还未从平台同步，请检查订单编号是否正确哦~');
                        return Promise.reject(new Error('订单不存在'));
                    }

                    // 订单验证成功，继续提交
                    submitBtn.innerHTML = '<span class="loading"></span>正在关联...';

                    const requestData = {
                        userId: 'peidi2',
                        code: authCode,
                        otid: orderNo
                    };

                    debugLog('准备提交数据到主接口', { url: API_URL, data: requestData });

                    return fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(requestData)
                    })
                        .then(response => {
                            debugLog('主接口响应状态', { status: response.status, statusText: response.statusText, ok: response.ok });
                            if (!response.ok) {
                                throw new Error(`网络请求失败: HTTP ${response.status} ${response.statusText}`);
                            }
                            return response.json();
                        })
                        .then(data => {
                            debugLog('主接口返回完整数据', data);
                            if (data.success || data.code === 200) {
                                showStatusOverlay('success', '关联成功啦！', '您的订单已与佩蒂数据中心成功绑定，接下来可以享受专属服务了哦~');
                                createConfetti();
                            } else {
                                const errorMsg = data.message || '订单关联失败，请检查订单编号是否正确';
                                showStatusOverlay('error', '关联失败了', errorMsg);
                            }
                        });
                })
                .catch(error => {
                    debugLog('===== 发生错误 =====', {
                        message: error.message,
                        stack: error.stack,
                        isOrderNotExist: error.message === '订单不存在'
                    });
                    if (error.message !== '订单不存在') {
                        showStatusOverlay('error', '网络有点小问题', `请检查您的网络连接后再试一次哦~ (${error.message})`);
                    }
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '确定关联';
                    debugLog('===== 流程结束 =====');
                });
        }

        // 显示消息
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        // 显示状态遮罩层
        function showStatusOverlay(type, title, desc) {
            const overlay = document.getElementById('statusOverlay');
            const iconWrapper = document.getElementById('statusIconWrapper');
            const successIcon = document.getElementById('successIcon');
            const errorIcon = document.getElementById('errorIcon');
            const statusTitle = document.getElementById('statusTitle');
            const statusDesc = document.getElementById('statusDesc');
            const statusBtn = document.getElementById('statusBtn');

            iconWrapper.className = 'status-icon-wrapper ' + type;
            successIcon.style.display = type === 'success' ? 'block' : 'none';
            errorIcon.style.display = type === 'error' ? 'block' : 'none';
            statusTitle.textContent = title;
            statusDesc.textContent = desc;
            statusBtn.textContent = type === 'success' ? '好的' : '重试';

            overlay.classList.add('active');
        }

        // 关闭状态遮罩层
        function closeStatusOverlay() {
            const overlay = document.getElementById('statusOverlay');
            const iconWrapper = document.getElementById('statusIconWrapper');
            const isSuccess = iconWrapper.classList.contains('success');

            if (isSuccess) {
                closePage();
            } else {
                overlay.classList.remove('active');
            }
        }

        // 关闭当前页面
        function closePage() {
            if (window.WeixinJSBridge) {
                // 微信环境
                WeixinJSBridge.call('closeWindow');
            } else if (window.wx && window.wx.closeWindow) {
                // 企业微信环境
                window.wx.closeWindow();
            } else {
                // 普通浏览器环境
                window.close();
            }
        }

        // 创建彩色纸屑动画
        function createConfetti() {
            const colors = ['#52c41a', '#13c2c2', '#1890ff', '#722ed1', '#eb2f96', '#faad14'];
            const overlay = document.getElementById('statusOverlay');

            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '30%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.animationDuration = (Math.random() * 1 + 1) + 's';
                overlay.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 2000);
            }
        }
    </script>
</body>

</html>
